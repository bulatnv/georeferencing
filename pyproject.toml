[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-geoloc"
# Держать в согласии с `__version__` в aero_geoloc/__init__.py.
version = "0.5.0.dev0"
description = "Аэро-геолокализация надирных снимков по картографической подложке"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Требуется начиная с фазы 1: matcher/pose/localize/testbench. Пакет
    # импортирует их из __init__, поэтому зависимость основная, а не опциональная.
    # OpenCV 5 перенёс AKAZE в xfeatures2d — отсюда сборка contrib, см. matcher.py.
    "opencv-contrib-python>=4.9",
]

[project.optional-dependencies]
# Реальные бортовые снимки: чтение EXIF/XMP (модуль drone.py). Загрузка тайлов
# подложки идёт через stdlib, а декод — через ядровой OpenCV, так что basemap
# доп. зависимостей не требует.
real = [
    "pillow>=10.0",
    # Манифест датасета оценки (aero_geoloc/dataset.py, datasets/*.yaml): в нём
    # живут приоры, GSD и подтверждённая владельцем истина.
    "pyyaml>=6.0",
]
# Обучаемые матчеры фазы 4 и энкодеры Этажа 1 (DINOv2/MegaLoc; нужен GPU-torch).
# LightGlue на PyPI не публикуется и потому здесь не указан — он идёт отдельной
# строкой в requirements-real.txt, где допустимы ссылки на git.
# MegaLoc-энкодер тянет веса через torch.hub → нужны huggingface_hub + safetensors.
learned = [
    "torch>=2.0",
    "torchvision>=0.15",
    "kornia>=0.7",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
]
# ANN-поиск Этажа 1 для больших территорий (TerrainIndex.use_faiss). Без него
# работает точный numpy-kNN (по умолчанию); нужен лишь для FAISS/HNSW-масштаба.
faiss = [
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["aero_geoloc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
