[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-geoloc"
version = "0.1.0.dev0"
description = "Аэро-геолокализация надирных снимков по картографической подложке"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # Требуется начиная с фазы 1: matcher/pose/localize/testbench. Пакет
    # импортирует их из __init__, поэтому зависимость основная, а не опциональная.
    # OpenCV 5 перенёс AKAZE в xfeatures2d — отсюда сборка contrib, см. matcher.py.
    "opencv-contrib-python>=4.9",
]

[project.optional-dependencies]
# Реальные бортовые снимки: чтение EXIF/XMP (модуль drone.py). Загрузка тайлов
# подложки идёт через stdlib, а декод — через ядровой OpenCV, так что basemap
# доп. зависимостей не требует.
real = [
    "pillow>=10.0",
]
# Обучаемые матчеры фазы 4 и DINOv2-энкодер фазы 3 (нужен GPU-torch). LightGlue
# ставится из GitHub: pip install "git+https://github.com/cvg/LightGlue.git".
learned = [
    "torch>=2.0",
    "torchvision>=0.15",
    "kornia>=0.7",
]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["aero_geoloc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
